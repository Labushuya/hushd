# ----------------------------------------------------------------------------
# Gradle JVM
# ----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configureondemand=false
org.gradle.workers.max=4
org.gradle.unsafe.configuration-cache-problems=warn

# ----------------------------------------------------------------------------
# Kotlin
# ----------------------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.mpp.stability.nowarn=true

# ----------------------------------------------------------------------------
# Android Gradle Plugin
# ----------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.suppressUnsupportedCompileSdk=34
android.lint.useK2Uast=true

# Reproducible builds
android.dependenciesInfo.includeInApk=false
android.dependenciesInfo.includeInBundle=false

# ----------------------------------------------------------------------------
# KSP (faster than kapt — Hilt + Room run via KSP)
# ----------------------------------------------------------------------------
ksp.incremental=true
ksp.incremental.intermodule=true

# ----------------------------------------------------------------------------
# Dependency verification — when verification-metadata.xml is present,
# Gradle enforces SHA-256 hashes for every artifact in the lock.
# Generate with:  ./gradlew --write-verification-metadata sha256,pgp help
# ----------------------------------------------------------------------------
# (No property toggle needed; presence of gradle/verification-metadata.xml activates it.)

# ----------------------------------------------------------------------------
# Hilt
# ----------------------------------------------------------------------------
dagger.hilt.android.useFragmentGetContextFix=true
